name: Report a bug
description: Describe a reproducible problem within the available scope.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Describe what happened and how to reproduce it. Use fictional examples and do not include credentials or private information.
        Do not use this form for a suspected security vulnerability. Follow the [security policy](https://github.com/juanNH/ReadmeGenerator/blob/dev/SECURITY.md) to report it privately.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What were you trying to do, and what happened?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the route...
        2. Activate the control...
        3. Observe...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Browser, operating system, and screen size; include the version or commit if known.
      placeholder: "Browser and version, operating system, affected route"
  - type: textarea
    id: evidence
    attributes:
      label: Evidence and additional context
      description: Screenshots, errors, or keyboard and accessibility details that may help reproduce the problem.
