name: Request a feature
description: Describe a user need and an observable outcome.
title: "[Feature]: "
body:
  - type: textarea
    id: need
    attributes:
      label: User need
      description: Who needs this improvement, and what are they trying to achieve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: Describe the behavior you have in mind without requiring a specific technical solution.
    validations:
      required: true
  - type: textarea
    id: success
    attributes:
      label: Success criterion
      description: What should the person be able to do for this need to be considered met?
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Product context
      description: Related product section or workflow, and alternatives you considered. Do not attach internal planning.
  - type: textarea
    id: accessibility
    attributes:
      label: Interface and accessibility
      description: Considerations for keyboard use, reading, narrow screens, or clarity, where relevant.
